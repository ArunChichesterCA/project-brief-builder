name: Tests

# Runs the automated tests on every pull request and every push to main.
# A pull request should only be merged when this check shows a green tick.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  run-tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the tests
        run: python -m unittest discover -s tests -v
